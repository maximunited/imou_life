# Mergify Configuration for Auto-merge
# Docs: https://docs.mergify.com/
#
# Merge queue is enabled on this repo. Direct `actions.merge` does not
# auto-merge; PRs only merge after they enter the queue. Auto-queue is
# `merge_protections_settings.auto_merge_conditions` (replaces deprecated
# `queue_rules[].autoqueue`). Omitting it leaves only the manual checkbox.

queue_rules:
  - name: default
    merge_method: squash
    commit_message_format:
      title: pr-title
      body: pr-body
    queue_conditions:
      - check-success=Pre-commit
      - check-success=HACS
      - check-success=Hassfest

merge_protections_settings:
  auto_merge_conditions:
    - or:
        - author=dependabot[bot]
        - author=pre-commit-ci[bot]
    - -draft
    - -label=do-not-merge

pull_request_rules:
  # Label bot updates that will auto-queue once CI passes
  - name: Label Dependabot updates
    conditions:
      - author=dependabot[bot]
      - -conflict
      - -draft
      - -label=do-not-merge
    actions:
      label:
        add:
          - auto-merge
          - dependencies

  - name: Label pre-commit.ci updates
    conditions:
      - author=pre-commit-ci[bot]
      - -conflict
      - -draft
      - -label=do-not-merge
    actions:
      label:
        add:
          - auto-merge
          - dependencies

  # Auto-approve Dependabot PRs
  - name: Auto-approve Dependabot
    conditions:
      - author=dependabot[bot]
      - -conflict
      - -draft
    actions:
      review:
        type: APPROVE
        message: "Auto-approved: Dependabot update."

  # Add labels based on PR title (conventional commits)
  - name: Label enhancement PRs
    conditions:
      - title~=^feat
    actions:
      label:
        add:
          - enhancement

  - name: Label bugfix PRs
    conditions:
      - title~=^fix
    actions:
      label:
        add:
          - bug

  - name: Label documentation PRs
    conditions:
      - title~=^docs
    actions:
      label:
        add:
          - documentation

  - name: Label refactoring PRs
    conditions:
      - title~=^refactor
    actions:
      label:
        add:
          - refactoring

  - name: Label test PRs
    conditions:
      - title~=^test
    actions:
      label:
        add:
          - tests

  - name: Label CI/CD PRs
    conditions:
      - title~=^ci
    actions:
      label:
        add:
          - github-actions

  # Request review from bots on new PRs
  - name: Request CodeRabbit review
    conditions:
      - -author=dependabot[bot]
      - -author=pre-commit-ci[bot]
      - -draft
      - -closed
      - -merged
    actions:
      comment:
        message: "@coderabbitai review"

  # Delete branch after merge

  # Warn about missing tests on feature PRs
  - name: Warn about missing tests
    conditions:
      - title~=^feat
      - -files~=^tests/
      - -label=skip-tests
    actions:
      comment:
        message: |
          ⚠️ This feature PR doesn't appear to include tests.

          Please add tests or add the `skip-tests` label.

  # Automatic rebase for PRs with conflicts
  - name: Auto-rebase on conflict
    conditions:
      - conflict
      - -draft
      - -merged
      - -closed
      - author=maximunited
    actions:
      comment:
        message: |
          This PR has merge conflicts.

          Comment `@mergifyio rebase` to automatically rebase.

  # Remind to update changelog for feature changes
  - name: Remind about changelog for features
    conditions:
      - title~=^feat
      - -files~=^docs/CHANGELOG\.md
      - -label=skip-changelog
      - -author=dependabot[bot]
    actions:
      comment:
        message: |
          📝 Don't forget to update `docs/CHANGELOG.md`!

          Add `skip-changelog` label if not needed.

  # Remind to update changelog for bugfixes
  - name: Remind about changelog for bugfixes
    conditions:
      - title~=^fix
      - -files~=^docs/CHANGELOG\.md
      - -label=skip-changelog
      - -author=dependabot[bot]
    actions:
      comment:
        message: |
          📝 Don't forget to update `docs/CHANGELOG.md`!

          Add `skip-changelog` label if not needed.

  # Auto-label PRs that modify workflows
  - name: Label workflow changes
    conditions:
      - files~=^\.github/workflows/
    actions:
      label:
        add:
          - github-actions

  # Auto-label PRs that modify dependencies
  - name: Label dependency changes
    conditions:
      - files~=^config/requirements
    actions:
      label:
        add:
          - dependencies

  # Auto-label PRs that modify docs
  - name: Label documentation changes
    conditions:
      - files~=^docs/
    actions:
      label:
        add:
          - documentation

  # Dismiss stale reviews when new commits are pushed (excludes bots)
  - name: Dismiss stale reviews on new commits
    conditions:
      - base=master
      - -author=dependabot[bot]
      - -author=pre-commit-ci[bot]
    actions:
      dismiss_reviews:
        approved: true
        changes_requested: false
        message: "New commits pushed - dismissing approval"
